<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Emerald Nature to Enterprise Tech Blue -->
    <linearGradient id="cendana-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="35%" stop-color="#059669" />
      <stop offset="70%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Branch Glow Gradient -->
    <linearGradient id="cendana-stem" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>

    <!-- Leaf / Node Gradient -->
    <linearGradient id="cendana-leaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="cendana-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Container -->
  <rect width="64" height="64" rx="16" fill="url(#cendana-bg)" />
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="1.2" />

  <!-- Radio Wave Canopy Arcs (Wi-Fi waves forming Tree Foliage) -->
  <path d="M 15 20 A 20 20 0 0 1 49 20" fill="none" stroke="rgba(255, 255, 255, 0.35)" stroke-width="2.2" stroke-linecap="round" />
  <path d="M 20.5 24.5 A 13.5 13.5 0 0 1 43.5 24.5" fill="none" stroke="rgba(255, 255, 255, 0.65)" stroke-width="2.2" stroke-linecap="round" />
  <path d="M 26 29 A 7 7 0 0 1 38 29" fill="none" stroke="#a7f3d0" stroke-width="2.2" stroke-linecap="round" filter="url(#cendana-glow)" />

  <!-- Tree Trunk & Digital Branches -->
  <!-- Main Trunk -->
  <path d="M 32 49 L 32 29" stroke="url(#cendana-stem)" stroke-width="3.2" stroke-linecap="round" />
  
  <!-- Root Flares (Grounding) -->
  <path d="M 26 51 C 29 50.5 31 49.5 32 49 C 33 49.5 35 50.5 38 51" fill="none" stroke="#6ee7b7" stroke-width="2.2" stroke-linecap="round" opacity="0.85" />

  <!-- Lower Branches (Curving upward like tree limbs & network forks) -->
  <path d="M 32 42 C 28 41 22 39 19 33" fill="none" stroke="url(#cendana-stem)" stroke-width="2.2" stroke-linecap="round" />
  <path d="M 32 42 C 36 41 42 39 45 33" fill="none" stroke="url(#cendana-stem)" stroke-width="2.2" stroke-linecap="round" />

  <!-- Mid Branches -->
  <path d="M 32 35 C 29 33 24 30 23 25" fill="none" stroke="url(#cendana-stem)" stroke-width="2" stroke-linecap="round" />
  <path d="M 32 35 C 35 33 40 30 41 25" fill="none" stroke="url(#cendana-stem)" stroke-width="2" stroke-linecap="round" />

  <!-- Upper Stem / Crown Lead -->
  <path d="M 32 29 L 32 16" stroke="url(#cendana-stem)" stroke-width="2.2" stroke-linecap="round" />

  <!-- Canopy Leaf Nodes / Network Data Points -->
  <!-- Top Pinnacle Node (Crown Apex) -->
  <circle cx="32" cy="14" r="3.2" fill="#ffffff" filter="url(#cendana-glow)" />
  <circle cx="32" cy="14" r="1.6" fill="#10b981" />

  <!-- Upper Canopy Nodes -->
  <circle cx="23" cy="24.5" r="2.6" fill="url(#cendana-leaf)" />
  <circle cx="41" cy="24.5" r="2.6" fill="url(#cendana-leaf)" />

  <!-- Mid Canopy Nodes -->
  <circle cx="19" cy="32.5" r="2.8" fill="#ffffff" />
  <circle cx="19" cy="32.5" r="1.5" fill="#0284c7" />
  <circle cx="45" cy="32.5" r="2.8" fill="#ffffff" />
  <circle cx="45" cy="32.5" r="1.5" fill="#0284c7" />

  <!-- Outer Foliage Accent Nodes -->
  <circle cx="15" cy="20" r="1.8" fill="#a7f3d0" />
  <circle cx="49" cy="20" r="1.8" fill="#a7f3d0" />

  <!-- Central Core / AAA Beacon (Heart of the Tree) -->
  <circle cx="32" cy="29" r="2" fill="#ffffff" filter="url(#cendana-glow)" />
</svg>
