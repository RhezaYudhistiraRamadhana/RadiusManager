<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="rm-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="rm-wave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="rm-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Container -->
  <rect width="64" height="64" rx="16" fill="url(#rm-bg)" />
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.2" />

  <!-- Outer Signal Wave -->
  <path d="M 14.4 19.2 A 23 23 0 0 1 49.6 19.2" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="2.8" stroke-linecap="round" />
  
  <!-- Middle Signal Wave -->
  <path d="M 19.7 23.7 A 16 16 0 0 1 44.3 23.7" fill="none" stroke="url(#rm-wave)" stroke-width="2.8" stroke-linecap="round" />

  <!-- Inner Signal Wave -->
  <path d="M 25.1 28.2 A 9 9 0 0 1 38.9 28.2" fill="none" stroke="#38bdf8" stroke-width="2.8" stroke-linecap="round" />

  <!-- Central Transmitter Beacon -->
  <circle cx="32" cy="33" r="2.5" fill="#ffffff" filter="url(#rm-glow)" />

  <!-- Left Antenna -->
  <line x1="21" y1="37" x2="16" y2="26" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" />
  <circle cx="16" cy="26" r="1.5" fill="#38bdf8" />

  <!-- Right Antenna -->
  <line x1="43" y1="37" x2="48" y2="26" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" />
  <circle cx="48" cy="26" r="1.5" fill="#38bdf8" />

  <!-- Router Base Unit -->
  <rect x="13" y="37" width="38" height="13" rx="4" fill="#ffffff" />
  
  <!-- Router Front Panel Inset -->
  <rect x="15.5" y="39.5" width="33" height="8" rx="2.5" fill="#0f172a" />

  <!-- Router Status LEDs -->
  <circle cx="20" cy="43.5" r="1.5" fill="#10b981" />
  <circle cx="24.5" cy="43.5" r="1.5" fill="#38bdf8" />
  <circle cx="29" cy="43.5" r="1.5" fill="#38bdf8" />
  
  <!-- Ethernet / Optical Ports -->
  <rect x="36" y="42" width="4.5" height="3" rx="0.8" fill="#334155" />
  <rect x="42" y="42" width="4.5" height="3" rx="0.8" fill="#334155" />
</svg>
